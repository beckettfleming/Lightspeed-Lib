title: Lightspeed
description: A from-scratch VEX V5RC robot library for PROS — team RoboPanthers (97934U)

remote_theme: just-the-docs/just-the-docs@v0.10.1

url: https://beckettfleming.github.io
baseurl: /Lightspeed-Lib

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# just-the-docs settings
color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/

heading_anchors: true

aux_links:
  "GitHub": https://github.com/beckettfleming/Lightspeed-Lib
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Lightspeed — VEX V5RC library for team RoboPanthers (97934U), built on PROS 4.2.2.'

# Link source files back to GitHub
gh_repo: https://github.com/beckettfleming/Lightspeed-Lib
gh_branch: main

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  placeholder:
    title: Placeholder
    color: yellow

exclude:
  - BUCKET_B_CHECKLIST.md
  - Gemfile
  - Gemfile.lock
  - vendor
